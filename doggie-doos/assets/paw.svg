<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Doggie Doos paw print">
  <!-- Heritage mascot, redrawn clean from the 2003 awning sign:
       yellow paw + dog silhouette, heavy outline kept but tidied. -->
  <g stroke="#0a2f52" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- main pad -->
    <path d="M32 30c8 0 14 6 14 13 0 6-5 9-14 9s-14-3-14-9c0-7 6-13 14-13z" fill="#ffc824"/>
    <!-- toes -->
    <ellipse cx="13" cy="26" rx="6.4" ry="8" fill="#ffc824" transform="rotate(-18 13 26)"/>
    <ellipse cx="24" cy="16" rx="6.6" ry="8.6" fill="#ffc824" transform="rotate(-6 24 16)"/>
    <ellipse cx="40" cy="16" rx="6.6" ry="8.6" fill="#ffc824" transform="rotate(6 40 16)"/>
    <ellipse cx="51" cy="26" rx="6.4" ry="8" fill="#ffc824" transform="rotate(18 51 26)"/>
    <!-- heart in the pad: the "doos" (love) touch -->
    <path d="M32 38c-1.8-2.4-5.4-2.2-5.4.6 0 2 2.4 3.4 5.4 5.6 3-2.2 5.4-3.6 5.4-5.6 0-2.8-3.6-3-5.4-.6z" fill="#ffffff" stroke-width="2"/>
  </g>
</svg>
